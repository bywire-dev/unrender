[package]
name = "unrender"
version = "0.1.0"
description = "Turn a terminal screen dump into a structured accessibility tree, so an agent can read a TUI as data instead of raw bytes."
keywords = ["tui", "terminal", "ansi", "accessibility", "agent"]
categories = ["command-line-interface", "parser-implementations", "accessibility"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vt100 = "0.16"
unicode-width = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "unrender"
path = "src/main.rs"
