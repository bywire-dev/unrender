name: ci

# Drift detection only. This workflow never calls a model and never spends
# money — the LLM benchmark is invoked manually and its results committed
# deliberately. See results/BENCHMARK.md.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace -- --nocapture

      # The published crate and the test harness must never shell out or open a
      # socket: fixture generation is xtask's job, and a live-tool dependency
      # creeping into the suite would turn somebody else's flaky zellij into
      # our red build. Checked structurally, because "it passed on my machine"
      # proves nothing about what it would do on a machine that has zellij.
      - name: assert the suite spawns no processes and opens no sockets
        run: |
          if grep -rnE 'process::Command|std::net|TcpStream|reqwest|tokio' \
               crates/unrender/src crates/unrender-eval/src crates/unrender-eval/tests; then
            echo "::error::the crate or its test harness gained a live dependency"
            exit 1
          fi
          echo "clean: no process spawning, no sockets"

  publish-safety:
    name: published crate stays clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The virtual-workspace layout is supposed to make it structurally
      # impossible for fixtures, tooling or results to reach crates.io.
      # Verify that, rather than trusting it.
      - name: no fixtures/tooling/results in the package
        run: |
          cargo package --list -p unrender > /tmp/files.txt
          cat /tmp/files.txt
          if grep -E '^(fixtures|results|xtask|docs)/' /tmp/files.txt; then
            echo "::error::non-crate paths leaked into the published package"
            exit 1
          fi

      - run: cargo publish --dry-run -p unrender
