[package]
name = "xtask"
version = "0.1.0"
description = "Fixture generation and results reporting. Not published."
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
unrender = { workspace = true }
unrender-eval = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
walkdir = { workspace = true }
# Network access lives here and nowhere else in the workspace -- CI's purity
# check greps crates/unrender and crates/unrender-eval specifically and never
# touches xtask, so this dependency cannot silently leak into the published
# crate or the pure test suite.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
# Vendor fixture generation: TestBackend renders widgets offline, no live
# terminal or zellij needed for frameworks that ship their own layout engine.
ratatui = "0.30"
# Textual's own golden snapshots are SVGs (Rich's terminal exporter); regex
# is enough to pull them apart because the format is machine-generated and
# highly regular (single-line, consistently-ordered attributes).
regex = "1"
